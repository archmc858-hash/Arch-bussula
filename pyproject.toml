[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-arch-mc"
version = "0.1.0"
description = "Plugin base for ARCH MC Bedrock server"
requires-python = ">=3.11"
dependencies = ["endstone==0.11.16"]

[project.entry-points."endstone"]
arch-mc = "arch_mc:ArchMCPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/arch_mc"]
